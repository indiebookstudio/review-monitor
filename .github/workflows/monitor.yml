name: KDP Review Monitor

on:
  schedule:
    # Esegue ogni 12 ore (alle 06:00 e 18:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Avvio manuale da sito GitHub o app mobile

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Review Monitor Check
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'saluccimarco@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'saluccimarco@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          python scripts/run_monitor.py --force

      - name: Commit and Push Database State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KDP review database [skip ci]" && git push)
