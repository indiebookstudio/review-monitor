name: KDP Review Monitor

# on:
#   schedule:
#     # Esegue ogni notte alle 03:25 UTC (04:25/05:25 ora italiana) per avere le notifiche pronte al mattino
#     - cron: '25 3 * * *'
on:
  workflow_dispatch:
    inputs:
      test_email_only:
        description: 'Esegui solo il test di invio email (senza scraping recensioni)'
        required: false
        type: boolean
        default: false

concurrency:
  group: kdp-monitor
  cancel-in-progress: false

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Test Email Only
        if: ${{ github.event.inputs.test_email_only == 'true' }}
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'saluccimarco@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || '' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || '' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://indiebookstudio.github.io/review-monitor/' }}
        run: |
          python scripts/test_email.py

      - name: Run Review Monitor Check
        if: ${{ github.event.inputs.test_email_only != 'true' }}
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'saluccimarco@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || '' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || '' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '' }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY || '' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://indiebookstudio.github.io/review-monitor/' }}
        run: |
          python scripts/run_monitor.py --force
          python scripts/generate_static_dashboard.py

      - name: Commit and Push Database and GitHub Pages
        if: ${{ github.event.inputs.test_email_only != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kdp_monitor.db docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update KDP review database and GitHub Pages [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            echo "No changes in database or dashboard to commit."
          fi
