name: KDP Review Monitor

on:
  schedule:
    # Esegue ogni notte alle 03:00 UTC (04:00/05:00 ora italiana) per avere le notifiche al mattino
    - cron: '0 3 * * *'
  workflow_dispatch: # Avvio manuale su richiesta da interfaccia GitHub o app mobile

concurrency:
  group: kdp-monitor
  cancel-in-progress: false

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Review Monitor Check
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'saluccimarco@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || '' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || '' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '' }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY || '' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://github.com/indiebookstudio/review-monitor' }}
        run: |
          python scripts/run_monitor.py --force


      - name: Commit and Push Database State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master || true
          git add data/kdp_monitor.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KDP review database [skip ci]" && git push)

